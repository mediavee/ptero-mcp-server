[project]
name = "ptero-mcp-server"
version = "0.2.0"
description = "MCP server exposing Pterodactyl panel operations and live console buffering"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Mediavee" }]
dependencies = [
    "fastmcp>=3.2.4,<4.0.0",
    "httpx>=0.28.1",
    "websockets>=14.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
]

[project.scripts]
ptero-mcp = "ptero_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptero_mcp"]

[tool.uv]
dev-dependencies = ["ruff>=0.8.0"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "SIM",           # flake8-simplify
    "RUF",           # ruff-specific
    "ASYNC",         # flake8-async
    "PTH",           # pathlib
    "TID",           # tidy imports
]
ignore = ["E501"]    # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
